apiVersion: batch/v1
kind: CronJob
metadata:
  name: maas-api-key-cleanup
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 60
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: maas-api-cleanup
        spec:
          serviceAccountName: maas-api-cleanup
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            # Numeric identity, required: runAsNonRoot refuses an image whose USER is symbolic
            # (ai-a1045 — the kubelet cannot verify "curl_user" is non-root, so every cleanup Job
            # died at container creation). uid 100 is curl_user in curlimages/curl and an ordinary
            # unprivileged uid in ubi9-minimal, so the CronJob stays safe across override images.
            runAsUser: 100
          containers:
          - name: cleanup
            image: registry.redhat.io/ubi9/ubi-minimal:9.7
            command:
            - /bin/sh
            - -c
            - |
              curl -sf -X POST http://maas-api:8080/internal/v1/api-keys/cleanup
            resources:
              requests:
                memory: "16Mi"
                cpu: "10m"
              limits:
                memory: "32Mi"
                cpu: "50m"
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault
